# The app is plain Java on the Android framework. AGP 9 adds built-in Kotlin (and kotlin-stdlib, ~2 MB, 1,104 types
# measured in build 1.0.50) to every app unless told not to: developer.android.com/build/migrate-to-built-in-kotlin.
android.builtInKotlin=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
