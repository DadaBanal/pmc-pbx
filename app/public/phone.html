<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PMC Phone</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#080b14">
<link rel="icon" href="/icons/phone-192.png">
<link rel="apple-touch-icon" href="/icons/phone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body class="phone-page">
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
  <symbol id="i-hang" viewBox="0 0 24 24"><path d="M3 15c5-5 13-5 18 0l-2.5 2.5-3.5-1.5v-2.5a10 10 0 0 0-6 0V16L5.5 17.5z"/></symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M9 5a3 3 0 0 1 6 0v6M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 10.8 5.9M12 18v3M3 3l18 18"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M6 6h.01M12 6h.01M18 6h.01M6 12h.01M12 12h.01M18 12h.01M6 18h.01M12 18h.01M18 18h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M20 20l-4-4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M21 6H9l-6 6 6 6h12zM17 10l-4 4M13 10l4 4"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M17 7 7 17M7 9v8h8"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></symbol>
  <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4v4a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4M12 14v6"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-voicemail" viewBox="0 0 24 24"><path d="M6.5 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M17.5 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M6.5 15.5h11"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5"/></symbol>
</svg>
<header class="top">
  <a class="brand" href="/phone"><i></i>PMC Phone</a>
  <nav aria-label="Status"><span id="status" class="chip" role="status"><span class="dot"></span><span id="status-text">Starting</span></span></nav>
  <div class="who" id="who"></div>
</header>
<main id="main" class="phone-main"></main>
<div id="say" class="sr-only" aria-live="polite"></div>
<div id="alert" class="sr-only" aria-live="assertive"></div>
<div id="incoming" class="incoming hidden" role="alertdialog" aria-modal="true" aria-labelledby="in-title" aria-describedby="in-who">
  <div class="incoming-box">
    <div class="in-ring" aria-hidden="true"><svg class="ic"><use href="#i-phone"></use></svg></div>
    <h2 id="in-title">Incoming call</h2>
    <p id="in-who" class="in-who"></p>
    <div class="in-actions">
      <button type="button" class="decline" id="in-decline"><svg class="ic" aria-hidden="true"><use href="#i-hang"></use></svg>Decline</button>
      <button type="button" class="answer" id="in-answer"><svg class="ic" aria-hidden="true"><use href="#i-phone"></use></svg>Answer</button>
      <button type="button" class="answer hidden" id="in-hold"><svg class="ic" aria-hidden="true"><use href="#i-pause"></use></svg>Hold and answer</button>
      <button type="button" class="answer alt hidden" id="in-end"><svg class="ic" aria-hidden="true"><use href="#i-hang"></use></svg>End and answer</button>
    </div>
  </div>
</div>
<div id="audios" hidden></div>
<footer>PMC Phone &mdash; your desk phone, in the browser.</footer>
<script src="/sip.js"></script>
<script src="/phone.js"></script>
</body>
</html>
