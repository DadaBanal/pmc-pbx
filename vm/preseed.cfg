# PMC-PBX01 Debian 12 preseed.
#
# PROVEN 13 Oct 2026: this file is the one that installed PMC-PBX01 unattended on Hyper-V (Gen2, Secure Boot,
# MS UEFI CA) on PMCWKS-181566 - started 12:53, SSH answering 12:57. Reconciled from the filed copy
# scripts/pbx-preseed-REDACTED-20261013.cfg in the record. Three changes since that run, each marked [NEW]
# below and NOT yet proven on a build:
#   1. the password is a SHA-512 hash, not plaintext (the 13 Oct run used the plaintext pair);
#   2. late_command sets the hostname and /etc/hosts;
#   3. pkgsel adds git, ca-certificates, gnupg, chrony and nftables (all checked in bookworm, 13 Oct).
#
# HOW IT IS DELIVERED. Boot the netinst ISO, choose Advanced options > Automated install, and type the URL of
# this file at the prompt. On that path the installer runs netcfg (DHCP, hostname "debian") BEFORE it fetches
# the file, so every netcfg/* line below is too late to matter. That is why the static address and the
# hostname are both written by late_command. The netcfg lines are kept for the other delivery routes (file in
# the initrd, or hostname= domain= on the kernel line), where they do take effect.
#
# Replace every <...> before use. Never commit a filled-in copy: the hash and the serving host stay out of git.
# Generate the hash on a trusted machine with:  openssl passwd -6

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
# Hyper-V needs no firmware. On bare metal set this to true so the installer can load NIC firmware if it asks.
d-i hw-detect/load_firmware boolean false

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string pmc-pbx01
d-i netcfg/get_domain string pmcne.ph
d-i netcfg/hostname string pmc-pbx01
d-i netcfg/wireless_wep string

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean false
d-i passwd/user-fullname string PMC Admin
d-i passwd/username string pmcadmin
# [NEW] hash instead of the plaintext pair used on 13 Oct, so the password never crosses the LAN in clear.
d-i passwd/user-password-crypted password <sha-512 hash from openssl passwd -6>
d-i passwd/user-default-groups string sudo

d-i clock-setup/utc boolean true
d-i time/zone string Asia/Manila
d-i clock-setup/ntp boolean true

# Whole first disk, one partition. Hyper-V presents it as /dev/sda. On bare metal with NVMe it is /dev/nvme0n1.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/services-select multiselect security, updates
tasksel tasksel/first multiselect ssh-server, standard
# [NEW] git, ca-certificates, gnupg, chrony, nftables added so phase 2 needs no package install first.
d-i pkgsel/include string sudo curl vim openssh-server git ca-certificates gnupg chrony nftables
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# late_command, in order: SSH key for pmcadmin fetched from the serving host; passwordless sudo for pmcadmin
# (a pilot-automation choice - Dada's call to tighten); static 10.2.0.10/22 on the first non-loopback NIC;
# DNS; [NEW] hostname and /etc/hosts. <serving-host> was the build PC, 10.2.3.186, on 13 Oct.
d-i preseed/late_command string in-target mkdir -p /home/pmcadmin/.ssh; wget -q -O /target/home/pmcadmin/.ssh/authorized_keys http://<serving-host>:8000/authorized_keys; in-target chown -R pmcadmin:pmcadmin /home/pmcadmin/.ssh; in-target chmod 700 /home/pmcadmin/.ssh; in-target chmod 600 /home/pmcadmin/.ssh/authorized_keys; echo 'pmcadmin ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/pmcadmin; chmod 440 /target/etc/sudoers.d/pmcadmin; IF=$(ls /sys/class/net | grep -v '^lo$' | head -n1); printf 'source /etc/network/interfaces.d/*\n\nauto lo\niface lo inet loopback\n\nallow-hotplug %s\niface %s inet static\n    address 10.2.0.10/22\n    gateway 10.2.0.1\n' "$IF" "$IF" > /target/etc/network/interfaces; printf 'search pmcne.ph\nnameserver 10.10.0.201\n' > /target/etc/resolv.conf; echo "$IF" > /target/root/pmc-install-interface.txt; echo pmc-pbx01 > /target/etc/hostname; printf '127.0.0.1 localhost\n10.2.0.10 pmc-pbx01.pmcne.ph pmc-pbx01\n\n::1 localhost ip6-localhost ip6-loopback\nff02::1 ip6-allnodes\nff02::2 ip6-allrouters\n' > /target/etc/hosts

d-i finish-install/reboot_in_progress note
