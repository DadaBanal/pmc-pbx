; pmc-pbx base pjsip.conf. Copy to /etc/asterisk/pjsip.conf. Everything that varies lives in the generated include.
; Transport, endpoint templates and every extension are generated by app/gen.js from directory.json.

[global]
type=global
user_agent=PMC-PBX
default_realm=pmc
endpoint_identifier_order=username
max_initial_qualify_time=4

[system]
type=system
timer_t1=500
timer_b=32000
disable_tcp_switch=no

#include /var/lib/pmc-pbx/out/asterisk/pjsip_pmc.conf
