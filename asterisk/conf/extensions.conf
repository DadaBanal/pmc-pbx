; pmc-pbx base extensions.conf. Copy to /etc/asterisk/extensions.conf.
; The [pmc-internal] context is generated by app/gen.js. Nothing else is needed for internal calling.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

; Unknown contexts land here and are refused, so a mis-provisioned endpoint cannot dial anything.
[default]
exten => _X.,1,Hangup(21)

#include /var/lib/pmc-pbx/out/asterisk/extensions_pmc.conf
