; pmc-pbx rtp.conf. 1,000 ports = about 250 concurrent calls with RTCP. Forward UDP 10000-10999 on the UDM.
; icesupport=yes is required by the browser phone: WebRTC endpoints (webrtc=yes) negotiate media with ICE, and
; Asterisk's docs say icesupport=no here disables ICE in RTP for everything. Desk phones are unaffected - their
; endpoints (pmc-endpoint) do not turn ICE on. Changed from no on 13 Oct 2026.
[general]
rtpstart=10000
rtpend=10999
strictrtp=yes
icesupport=yes

; The public face of the browser phone's audio, generated by the app from config.json webrtcPublicAddress (Dada,
; 14 Oct 2026: "it should work as long as there is an internet connection"). Asterisk's own sample documents the
; section: [ice_host_candidates] <local> => <public>,include_local_address, for a server behind a one-to-one NAT;
; include_local_address keeps the LAN address too, so phones inside the hospital still go direct. Empty until set.
#include /var/lib/pmc-pbx/out/asterisk/rtp_pmc.conf
