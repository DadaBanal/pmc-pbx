; pmc-pbx rtp.conf. 1,000 ports = about 250 concurrent calls with RTCP. Forward UDP 10000-10999 on the UDM.
; icesupport=yes is required by the browser phone: WebRTC endpoints (webrtc=yes) negotiate media with ICE, and
; Asterisk's docs say icesupport=no here disables ICE in RTP for everything. Desk phones are unaffected - their
; endpoints (pmc-endpoint) do not turn ICE on. Changed from no on 13 Oct 2026.
[general]
rtpstart=10000
rtpend=10999
strictrtp=yes
icesupport=yes
