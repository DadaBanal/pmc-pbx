; pmc-pbx: the shape of a carrier trunk, NOT IN USE. The 7 Oct 2026 decision is "no external trunks"; this file
; exists so the day a trunk is wanted the work is one include and two dialplan contexts, as described in the
; record (docs/pbx-sip-trunk-what-it-entails-20261008.md). Nothing includes this file.
;
; Shape from docs.asterisk.org, res_pjsip Configuration Examples ("Trunks are a little tricky since many providers
; have unique requirements"). Replace every <...> with the carrier's values. Secrets never go in git: the live
; version is generated into /var/lib/pmc-pbx/out/asterisk/ by the app, with the password from secrets.json.

; ---- route B: the provider wants us to register (internet-delivered trunk) ----
;[trunk-carrier]
;type=registration
;outbound_auth=trunk-carrier
;server_uri=sip:<sip.carrier.example>
;client_uri=sip:<account>@<sip.carrier.example>
;retry_interval=60
;
;[trunk-carrier]
;type=auth
;auth_type=userpass
;username=<account>
;password=<from secrets.json>

; ---- routes A and B: where the carrier lives and how its calls are recognised ----
;[trunk-carrier]
;type=aor
;contact=sip:<sip.carrier.example>:5060
;qualify_frequency=60
;
;[trunk-carrier]
;type=endpoint
;context=from-outside            ; inbound calls land here (DID -> desk, ring group or attendant)
;disallow=all
;allow=alaw
;allow=ulaw
;outbound_auth=trunk-carrier     ; drop for a carrier that authenticates by address (route A)
;aors=trunk-carrier
;from_user=<main number>
;from_domain=<sip.carrier.example>
;direct_media=no
;rtp_symmetric=yes
;force_rport=yes
;rewrite_contact=yes
;dtmf_mode=rfc4733
;
;[trunk-carrier]
;type=identify
;endpoint=trunk-carrier
;match=<carrier SBC address or host>

; ---- dialplan, to live in extensions_trunk.conf ----
;[from-outside]
;exten => <DID main>,1,Goto(pmc-internal,<attendant or desk>,1)
;exten => <DID desk>,1,Goto(pmc-internal,<extension>,1)
;
;[pmc-outside]                   ; included from pmc-internal for extensions allowed to dial out
;exten => 911,1,Dial(PJSIP/911@trunk-carrier)                      ; emergency: always allowed
;exten => _0ZXXXXXXXX,1,Set(CALLERID(num)=<main number>)           ; domestic: 0 + area code
; same => n,Dial(PJSIP/${EXTEN}@trunk-carrier,60)
;exten => _09XXXXXXXXX,1,Set(CALLERID(num)=<main number>)          ; mobiles
; same => n,Dial(PJSIP/${EXTEN}@trunk-carrier,60)
;; international (00...) deliberately absent: off by default, per-extension class when ever wanted
