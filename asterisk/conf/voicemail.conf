; PMC PBX - voicemail. Copy to /etc/asterisk/voicemail.conf (app/README.md, "On the VM").
; The mailboxes themselves are generated by the app on every Apply into voicemail_pmc.conf, context [pmc]: one per
; extension with voicemail on. Before 14 Oct 2026 there were none and every unanswered call dropped the caller.
; Every option below appears in Asterisk 22.11.0's configs/samples/voicemail.conf.sample.
; *97 from your own phone opens your mailbox without a PIN (the dialplan uses the authenticated endpoint).

[general]
format=wav49|wav
attach=no              ; no email: voicemail-to-email is not built
maxmsg=100
maxsecs=180
minsecs=2
maxsilence=10
silencethreshold=128
maxlogins=3
skipms=3000
review=no
saycid=no
envelope=yes

#include /var/lib/pmc-pbx/out/asterisk/voicemail_pmc.conf
