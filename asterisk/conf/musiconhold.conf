; PMC PBX - hold music (WS47, 14 Oct 2026). Dada: "go for the raido or any radio that plays english 2000's music or
; filipino music". The default class plays internet radio through /usr/local/bin/pmc-moh-radio (vm/pmc-moh-radio.sh in
; the repo): 16 kHz mono PCM, 2000s hits first, Filipino pop as the fallback.
; directory= on purpose, holding ONE empty file, pmc-placeholder.raw. res_musiconhold.c reads a custom player all the
; time when no directory is set ("nodir"), and only while someone is on hold when one is. With a directory it refuses to
; start the player unless it finds a .raw/.sln/.mp3 file there ("Found no files", 14 Oct 2026 09:12) and passes the
; files to the player as arguments, which pmc-moh-radio ignores. MEASURED 14 Oct 2026 from the player's /proc io: idle
; 30 s, 0 bytes moved; on hold 15 s, 483,328 bytes of PCM out (32 KB/s, real time). The PBX's whole-interface byte count
; cannot tell this apart: about 280 kbit/s of other traffic arrives with no player running.
; The music files that came with Asterisk stay available as class 'files'.

[general]

[default]
mode=custom
application=/usr/local/bin/pmc-moh-radio
format=slin16
directory=/var/lib/asterisk/moh-radio
kill_escalation_delay=500

[files]
mode=files
directory=moh
