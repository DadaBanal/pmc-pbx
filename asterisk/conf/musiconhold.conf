; PMC PBX - hold music (WS47, 14 Oct 2026). Dada: "go for the raido or any radio that plays english 2000's music or
; filipino music". The default class plays internet radio through /usr/local/bin/pmc-moh-radio (vm/pmc-moh-radio.sh in
; the repo): 16 kHz mono PCM, 2000s hits first, Filipino pop as the fallback.
; directory= an EMPTY directory, on purpose. With none set Asterisk uses "nodir" and reads the stream all the time
; (res_musiconhold.c; MEASURED 14 Oct 2026: 462 kbit/s in with nobody on hold). With a real directory it reads only while
; someone is on hold, and passes the player any .raw/.sln/.mp3 files in it - so it must stay empty.
; The music files that came with Asterisk stay available as class 'files'.

[general]

[default]
mode=custom
application=/usr/local/bin/pmc-moh-radio
format=slin16
directory=/var/lib/asterisk/moh-radio
kill_escalation_delay=500

[files]
mode=files
directory=moh
