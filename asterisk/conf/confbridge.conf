; PMC PBX - conference profiles for three-way calls and conferences (WS47, 14 Oct 2026).
; Dada, 14 Oct 2026: "three way calling conferenfce". The dialplan (extensions_pmc.conf, generated) sends room
; *88<ext> here: the owner joins as pmc_owner, the calls the owner transfers in join as pmc_guest.
; No prompts, no menus: it should feel like a three-way call on a desk phone, not a conference service.

[general]

[pmc_bridge]
type=bridge
max_members=10
internal_sample_rate=auto     ; wideband (G.722) stays wideband in the mix
mixing_interval=20
record_conference=no
video_mode=none

[pmc_owner]
type=user
marked=yes                    ; the room lives while its owner is in it
quiet=yes                     ; no join and leave sounds
announce_user_count=no
announce_only_user=no
music_on_hold_when_empty=no
dsp_drop_silence=yes
dtmf_passthrough=no

[pmc_guest]
type=user
end_marked=yes                ; the owner hangs up: the call ends for everyone, as a three-way call does
wait_marked=no
quiet=yes
announce_user_count=no
announce_only_user=no
music_on_hold_when_empty=yes  ; the first person moved in hears hold music for the second it takes the next to join
dsp_drop_silence=yes
dtmf_passthrough=no
